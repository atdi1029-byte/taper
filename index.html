<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taper</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDF0F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141D26; --muted:#66727F; --hair:#D7DDE3;
    --accent:#B8621B; --accent-ink:#FFFFFF; --line:#C63A45; --ma:#141D26; --soft:#F6EEE6;
    --radius:14px;
  }
  body[data-mode="night"]{
    --bg:#141726; --surface:#1D2136; --ink:#ECEBF7; --muted:#9A9DBA; --hair:#2E3350;
    --accent:#9B93F0; --accent-ink:#0F1120; --line:#F27089; --ma:#ECEBF7; --soft:#262A45;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    font-size:16px; line-height:1.4; font-variant-numeric:tabular-nums;
    transition:background-color .35s ease, color .35s ease;
    padding-bottom:120px;
  }
  .wrap{max-width:640px; margin:0 auto; padding:18px 16px 0}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .brand{font-weight:800; font-size:22px; letter-spacing:-0.02em}
  .seg{display:flex; background:var(--surface); border:1px solid var(--hair); border-radius:999px; padding:3px; transition:background-color .35s ease}
  .seg button{
    border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600;
    padding:7px 14px; border-radius:999px; cursor:pointer;
  }
  .seg button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}

  .card{background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; transition:background-color .35s ease}
  .readout{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  .big{font-size:54px; font-weight:700; letter-spacing:-0.03em; line-height:1}
  .big small{font-size:20px; font-weight:500; color:var(--muted); margin-left:4px; letter-spacing:0}
  .big .cap{display:block; font-size:14px; font-weight:500; color:var(--muted); letter-spacing:0; margin-bottom:4px}
  .status{font-size:15px; color:var(--muted); max-width:22ch; text-align:right}
  .status strong{color:var(--ink); font-weight:600}
  .status.over strong{color:var(--line)}
  .facts{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:14px; margin-top:10px}
  .facts b{color:var(--ink); font-weight:600}
  .note{color:var(--muted); font-size:14px; margin-top:10px}
  .note b{color:var(--ink); font-weight:600}

  svg.chart{width:100%; height:auto; display:block; margin-top:8px}
  .grid{stroke:var(--hair); stroke-width:1}
  .ylab,.xlab{fill:var(--muted); font-size:11px; font-family:inherit}
  .bar{fill:var(--accent); opacity:.55}
  .bar.today{opacity:1}
  .bar.over{fill:var(--line)}
  .ma{fill:none; stroke:var(--ma); stroke-width:1.6; opacity:.7}
  .ceil{fill:none; stroke:var(--line); stroke-width:2.5; stroke-linejoin:round}
  .ceil.future{stroke-dasharray:4 5; opacity:.7}
  .ceil.calib{opacity:.3}
  .todayline{stroke:var(--hair); stroke-width:1; stroke-dasharray:2 3}
  .legend{display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:4px; flex-wrap:wrap}
  .legend i{display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; border-radius:2px}
  .legend .sw-bar{background:var(--accent); height:10px; width:10px; opacity:.6}
  .legend .sw-ma{background:var(--ma); opacity:.7}
  .legend .sw-line{background:var(--line)}

  h2{font-size:16px; font-weight:700; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline}
  h2 span{font-weight:500; color:var(--muted); font-size:14px}
  .log{list-style:none; margin:0; padding:0}
  .log li{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--hair)}
  .log li:first-child{border-top:0}
  .log .t{color:var(--muted); width:72px; flex:none; font-size:14px}
  .log .n{flex:1}
  .log .mg{font-weight:600}
  .x{border:0; background:transparent; color:var(--muted); font-size:20px; line-height:1; width:32px; height:32px; border-radius:8px; cursor:pointer}
  .x:hover{background:var(--soft); color:var(--ink)}
  .empty{color:var(--muted); font-size:14px; padding:6px 0}
  .dayhead{font-weight:600; margin:12px 0 2px; display:flex; justify-content:space-between}
  .dayhead span{color:var(--muted); font-weight:500}

  details{background:var(--surface); border-radius:var(--radius); margin-bottom:12px; transition:background-color .35s ease}
  details summary{cursor:pointer; padding:14px 16px; font-weight:700; list-style:none; display:flex; justify-content:space-between; align-items:center}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+"; color:var(--muted); font-weight:500; font-size:20px}
  details[open] summary::after{content:"–"}
  details .body{padding:0 16px 16px}
  .field{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--hair)}
  .field:first-child{border-top:0}
  .field label{flex:1}
  .field label small{display:block; color:var(--muted); font-size:13px; font-weight:400}
  input[type=number],input[type=text],input[type=date],input[type=datetime-local],textarea{
    font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--hair); border-radius:8px; padding:8px 10px;
  }
  .field input{width:120px}
  textarea{width:100%; min-height:90px; font-size:12px; font-family:ui-monospace, monospace}
  .btn{font:inherit; font-weight:600; border:1px solid var(--hair); background:var(--surface); color:var(--ink); border-radius:10px; padding:9px 14px; cursor:pointer}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.danger{color:var(--line)}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .row input{flex:1; min-width:90px}
  .hint{color:var(--muted); font-size:13px; margin:8px 0 0}

  .tray{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:linear-gradient(to top, var(--bg) 78%, transparent);
    padding:18px 0 max(14px, env(safe-area-inset-bottom));
    transition:background .35s ease;
  }
  .tray .inner{max-width:640px; margin:0 auto; padding:0 16px}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; font:inherit; font-weight:600; cursor:pointer;
    background:var(--surface); color:var(--ink); border:1.5px solid var(--hair); border-radius:999px; padding:10px 14px;
    display:flex; flex-direction:column; align-items:flex-start; gap:1px; line-height:1.1;
    transition:transform .08s ease, border-color .15s ease;
  }
  .chip small{font-weight:500; color:var(--muted); font-size:12px}
  .chip:active{transform:scale(.96)}
  .chip.custom{border-style:dashed; justify-content:center}
  .custom-form{background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius); padding:12px; margin-bottom:10px; display:none}
  .custom-form.open{display:block}
  .custom-form .row{margin-top:0}
  .custom-form .row + .row{margin-top:8px}

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:110px; z-index:6;
    background:var(--ink); color:var(--bg); border-radius:999px; padding:10px 14px 10px 16px;
    display:flex; gap:12px; align-items:center; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{opacity:1; pointer-events:auto}
  .toast button{font:inherit; font-weight:700; background:transparent; border:0; color:var(--accent); cursor:pointer; padding:0}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  @media (max-width:420px){ .big{font-size:46px} .status{max-width:100%; text-align:left} }
</style>
</head>
<body data-mode="day">
<div class="wrap">
  <header>
    <div class="brand">Taper</div>
    <div class="seg" role="tablist" aria-label="Substance">
      <button role="tab" data-mode="caf" aria-selected="true">Caffeine</button>
      <button role="tab" data-mode="dph" aria-selected="false">Benadryl</button>
    </div>
  </header>

  <section class="card" id="hero"></section>
  <section class="card" id="logcard"></section>
  <details id="settings"><summary>Taper settings</summary><div class="body" id="settingsBody"></div></details>
  <details id="data"><summary>Export and import</summary><div class="body" id="dataBody"></div></details>
</div>

<div class="tray">
  <div class="inner">
    <div class="custom-form" id="customForm"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

const SUBS = {
  caf: {
    label:'Caffeine', unit:'mg', snap:20, minAxis:100,
    presets:[
      {name:'Espresso', mg:63}, {name:'Coffee, 8 oz', mg:95}, {name:'Cold brew, 12 oz', mg:155},
      {name:'Red Bull, 8.4 oz', mg:80}, {name:'Monster, 16 oz', mg:160}, {name:'Black tea', mg:47},
      {name:'Green tea', mg:28}, {name:'Cola, 12 oz', mg:34}
    ],
    defaults:{ taper:4.5, goal:95, window:7, baseline:1000, start:null, cutoff:4 }
  },
  dph: {
    label:'Benadryl', unit:'mg', snap:12.5, minAxis:25,
    presets:[
      {name:'1 tablet', mg:25}, {name:'Half tablet', mg:12.5}, {name:'2 tablets', mg:50}
    ],
    defaults:{ taper:2.7, goal:0, window:7, baseline:100, start:null, cutoff:12 }
  }
};
const KEY = 'taper:state';
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwt438APIycBc534W6T66O3IgtxLUU9cczw-PZAN6Mc9p2xfU2ySsND_wEMJDHUvrXyUg/exec';

let S = null;
let mode = 'caf';
let toastTimer = null;
let undoFn = null;

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { if (n == null || isNaN(n)) return '–'; const r = Math.round(n*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ---------- dates ----------
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ const d = parseDay(k); d.setDate(d.getDate()+n); return fmtDate(d); }
function daysBetween(a, b){ return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
function dayKey(ts, cutoff){ const d = new Date(ts); d.setHours(d.getHours() - cutoff); return fmtDate(d); }
function todayKey(sub){ return dayKey(Date.now(), S.settings[sub].cutoff); }
function shortDate(k){ return parseDay(k).toLocaleDateString([], {month:'short', day:'numeric'}); }
function longDate(k){ return parseDay(k).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}); }
function timeOf(ts){ return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function localInputValue(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }

// ---------- storage ----------
function defaultState(){
  return { version:1, entries:[], presets:{caf:[], dph:[]},
    settings:{ caf:Object.assign({}, SUBS.caf.defaults), dph:Object.assign({}, SUBS.dph.defaults) } };
}
function migrate(s){
  const d = defaultState();
  return {
    version:1,
    entries: Array.isArray(s.entries) ? s.entries : [],
    presets: { caf:(s.presets&&s.presets.caf)||[], dph:(s.presets&&s.presets.dph)||[] },
    settings: {
      caf: Object.assign({}, d.settings.caf, (s.settings||{}).caf||{}),
      dph: Object.assign({}, d.settings.dph, (s.settings||{}).dph||{})
    }
  };
}
// ---- sync helpers ----
function fireGet(url){ var img = new Image(); img.src = url; }
function jsonpFetch(url, cb){
  const cbName = '_tpCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const script = document.createElement('script');
  let done = false, timer;
  function finish(err, resp){
    if (done) return; done = true; clearTimeout(timer);
    delete window[cbName]; if (script.parentNode) script.remove();
    cb(err, resp);
  }
  window[cbName] = function(resp){ finish(null, resp); };
  timer = setTimeout(function(){ finish('timeout'); }, 12000);
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  script.onerror = function(){ finish('network'); };
  document.head.appendChild(script);
}

function load(){
  let s = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) s = JSON.parse(raw);
  } catch(e) {}
  S = s ? migrate(s) : defaultState();
  // Pull cloud data in background, merge if newer
  jsonpFetch(SYNC_URL + '?action=taper_get', function(err, resp){
    if (err || !resp || resp.status !== 'ok' || !resp.taper) return;
    try {
      const cloud = migrate(resp.taper);
      if (cloud.entries.length > S.entries.length) {
        // Cloud has more data — merge by taking unique entries
        const ids = new Set(S.entries.map(e => e.id));
        cloud.entries.forEach(e => { if (!ids.has(e.id)) S.entries.push(e); });
        saveLocal(); render();
      } else if (cloud.entries.length && S.entries.length === 0) {
        S = cloud; saveLocal(); render();
      }
    } catch(e) { console.warn('Cloud merge failed', e); }
  });
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}
let saveTimer = null;
function save(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    const encoded = encodeURIComponent(JSON.stringify(S));
    if (encoded.length < 7000) {
      fireGet(SYNC_URL + '?action=taper_save&data=' + encoded);
    } else {
      // Chunked save for large datasets
      const data = JSON.stringify(S);
      const chunkSize = 5000;
      const chunks = [];
      for (let i = 0; i < data.length; i += chunkSize) chunks.push(data.slice(i, i + chunkSize));
      let idx = 0;
      function sendChunk(){
        if (idx >= chunks.length) {
          jsonpFetch(SYNC_URL + '?action=taper_save_done&n=' + chunks.length, function(){});
          return;
        }
        jsonpFetch(SYNC_URL + '?action=taper_save_chunk&i=' + idx + '&cd=' + encodeURIComponent(chunks[idx]), function(){ idx++; sendChunk(); });
      }
      sendChunk();
    }
  }, 500);
}

// ---------- model ----------
function series(sub){
  const st = S.settings[sub], cfg = SUBS[sub];
  const totals = {};
  S.entries.filter(e => e.sub === sub).forEach(e => { const k = dayKey(e.ts, st.cutoff); totals[k] = (totals[k]||0) + e.mg; });
  const keys = Object.keys(totals).sort();
  const today = todayKey(sub);
  let start = st.start || keys[0] || null;
  const out = { today, start, days:[], chart:[], baseline:null, calibrating:false, completed:0, goalDate:null, atGoal:false };
  if (!start) return out;
  if (start > today) start = today;
  out.start = start;

  const n = daysBetween(start, today);
  const days = [];
  for (let i = 0; i <= n; i++){ const k = addDays(start, i); days.push({ k, i, total: totals[k]||0, isToday: i === n }); }

  const manual = st.baseline != null && st.baseline !== '';
  let baseline, lockDay = 0, calibrating = false;
  const completed = days.slice(0, days.length - 1);
  out.completed = completed.length;
  if (manual) { baseline = Number(st.baseline); lockDay = 0; }
  else {
    lockDay = st.window;
    if (completed.length >= st.window) baseline = mean(completed.slice(0, st.window).map(d => d.total));
    else { calibrating = true; baseline = completed.length ? mean(completed.map(d => d.total)) : days[days.length-1].total; }
  }
  const r = 1 - st.taper/100;
  const floor = Math.max(0, Number(st.goal) || 0);
  const snapAt = floor < cfg.snap ? cfg.snap : null;
  const ceil = i => {
    if (baseline == null) return null;
    let c = i < lockDay ? baseline : baseline * Math.pow(r, (i - lockDay) / 7);
    if (c < floor) c = floor;
    if (snapAt != null && c < snapAt) c = floor;
    return c;
  };
  days.forEach((d, i) => {
    const w = days.slice(Math.max(0, i - st.window + 1), i + 1);
    d.ma = mean(w.map(x => x.total));
    d.ceil = calibrating && !manual ? baseline : ceil(i);
    d.calib = !manual && i < lockDay;
  });

  // goal date
  const target = Math.max(floor, snapAt != null ? snapAt : floor);
  if (!calibrating && baseline != null) {
    if (baseline <= target) out.atGoal = true;
    else if (r < 1 && r > 0) {
      const weeks = Math.log(target / baseline) / Math.log(r);
      out.goalDate = addDays(start, lockDay + Math.ceil(weeks * 7));
    }
  }

  // chart window: last 28 days + 7 ahead
  const from = Math.max(0, n - 27);
  const chart = days.slice(from).map(d => Object.assign({}, d, { future:false }));
  for (let f = 1; f <= 7; f++) chart.push({ k: addDays(today, f), i: n + f, total:null, ma:null, ceil: calibrating ? baseline : ceil(n + f), future:true, isToday:false });

  out.days = days; out.chart = chart; out.baseline = baseline; out.calibrating = calibrating;
  return out;
}

// ---------- chart ----------
function niceStep(raw){
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p;
  const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return nf * p;
}
function chartSVG(ser, sub){
  const pts = ser.chart; if (!pts.length) return '';
  const W = 600, H = 240, L = 40, R = 12, T = 14, B = 26;
  let ymax = 0;
  pts.forEach(p => { ymax = Math.max(ymax, p.total||0, p.ma||0, p.ceil||0); });
  ymax = Math.max(ymax * 1.15, SUBS[sub].minAxis);
  const step = niceStep(ymax / 4); ymax = Math.ceil(ymax / step) * step;
  const n = pts.length, slot = (W - L - R) / n, bw = Math.min(slot * 0.62, 24);
  const x = i => L + slot * i + slot / 2;
  const y = v => T + (H - T - B) * (1 - v / ymax);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Daily intake against the taper line">`;
  for (let v = step; v <= ymax + 0.001; v += step) s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ylab" x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  const todayIdx = pts.findIndex(p => p.isToday);
  if (todayIdx >= 0) s += `<line class="todayline" x1="${x(todayIdx).toFixed(1)}" x2="${x(todayIdx).toFixed(1)}" y1="${T}" y2="${(H-B).toFixed(1)}"/>`;
  pts.forEach((p, i) => {
    if (p.future) return;
    const h = Math.max(0, y(0) - y(p.total));
    const over = p.ceil != null && !p.calib && p.total > p.ceil + 0.01;
    s += `<rect class="bar${over?' over':''}${p.isToday?' today':''}" x="${(x(i)-bw/2).toFixed(1)}" y="${y(p.total).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`;
  });
  const maPath = pts.map((p, i) => p.future || p.ma == null ? null : `${x(i).toFixed(1)},${y(p.ma).toFixed(1)}`).filter(Boolean);
  if (maPath.length > 1) s += `<polyline class="ma" points="${maPath.join(' ')}"/>`;
  const calib = [], past = [], fut = [];
  pts.forEach((p, i) => {
    if (p.ceil == null) return;
    const pt = `${x(i).toFixed(1)},${y(p.ceil).toFixed(1)}`;
    if (p.future) fut.push(pt); else if (p.calib) calib.push(pt); else past.push(pt);
  });
  if (calib.length) s += `<polyline class="ceil calib" points="${calib.concat(past.length ? [past[0]] : []).join(' ')}"/>`;
  if (past.length) s += `<polyline class="ceil" points="${past.join(' ')}"/>`;
  const last = past.length ? past[past.length-1] : calib.length ? calib[calib.length-1] : null;
  if (fut.length && last) s += `<polyline class="ceil future" points="${[last].concat(fut).join(' ')}"/>`;
  const labelEvery = n > 20 ? 7 : n > 10 ? 4 : 2;
  pts.forEach((p, i) => {
    if (p.isToday || i === 0 || (i % labelEvery === 0 && !p.future)) {
      const t = p.isToday ? 'today' : shortDate(p.k);
      s += `<text class="xlab" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${t}</text>`;
    }
  });
  s += '</svg>';
  return s;
}

// ---------- render ----------
function render(){
  document.body.dataset.mode = mode === 'dph' ? 'night' : 'day';
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === mode ? 'true' : 'false'));
  renderHero(); renderLog(); renderChips(); renderSettings(); renderData();
}

function renderHero(){
  const sub = mode, st = S.settings[sub], cfg = SUBS[sub];
  const ser = series(sub);
  const today = ser.days[ser.days.length - 1];
  const total = today ? today.total : 0;
  const c = today ? today.ceil : null;
  let status = '', cls = '';
  if (!ser.start) status = 'No line yet';
  else if (ser.calibrating) status = `Provisional line <strong>${fmt(c)} mg</strong>`;
  else if (total <= c) status = `<strong>${fmt(c - total)} mg</strong> left under today's line of ${fmt(c)}`;
  else { status = `<strong>${fmt(total - c)} mg</strong> over today's line of ${fmt(c)}`; cls = 'over'; }

  let html = `<div class="readout"><div class="big"><span class="cap">${cfg.label} today</span>${fmt(total)}<small>mg</small></div><div class="status ${cls}">${status}</div></div>`;

  if (!ser.start) {
    html += `<p class="note">Log your first dose from the tray below. After ${st.window} days the line draws itself from your average and starts dropping ${st.taper}% a week. To skip the wait, set a baseline in settings.</p>`;
  } else {
    html += chartSVG(ser, sub);
    html += `<div class="legend"><span><i class="sw-bar"></i>daily total</span><span><i class="sw-ma"></i>${st.window}-day average</span><span><i class="sw-line"></i>the line</span></div>`;
    if (ser.calibrating) {
      html += `<p class="note"><b>Calibrating, ${ser.completed} of ${st.window} days.</b> The line locks in from your first ${st.window} days, then drops ${st.taper}% a week toward ${fmt(st.goal)} mg.</p>`;
    } else {
      const maRel = today.ma <= c ? 'under' : 'over';
      let proj = '';
      if (ser.atGoal) proj = 'The line is at your goal.';
      else if (ser.goalDate) proj = `At ${st.taper}% a week the line reaches ${fmt(st.goal)} mg around ${longDate(ser.goalDate)}.`;
      html += `<div class="facts"><span>${st.window}-day average <b>${fmt(today.ma)} mg</b>, ${maRel} the line</span><span>Started from <b>${fmt(ser.baseline)} mg</b></span></div>`;
      if (proj) html += `<p class="note">${proj}</p>`;
    }
  }
  $('#hero').innerHTML = html;
}

function renderLog(){
  const sub = mode, st = S.settings[sub];
  const today = todayKey(sub);
  const mine = S.entries.filter(e => e.sub === sub).sort((a, b) => b.ts.localeCompare(a.ts));
  const byDay = {};
  mine.forEach(e => { const k = dayKey(e.ts, st.cutoff); (byDay[k] = byDay[k] || []).push(e); });
  const row = e => `<li><span class="t">${timeOf(e.ts)}</span><span class="n">${esc(e.name)}</span><span class="mg">${fmt(e.mg)} mg</span><button class="x" data-del="${e.id}" aria-label="Remove ${esc(e.name)}">×</button></li>`;
  const todays = byDay[today] || [];
  let html = `<h2>Today <span>${todays.length ? fmt(todays.reduce((a, e) => a + e.mg, 0)) + ' mg' : ''}</span></h2>`;
  html += todays.length ? `<ul class="log">${todays.map(row).join('')}</ul>` : `<p class="empty">Nothing logged yet today.</p>`;
  const earlier = Object.keys(byDay).filter(k => k !== today).sort().reverse().slice(0, 14);
  if (earlier.length) {
    html += `<details style="margin:10px 0 0; background:transparent"><summary style="padding:6px 0; font-weight:600; color:var(--muted)">Earlier days</summary>`;
    earlier.forEach(k => {
      html += `<div class="dayhead">${longDate(k)}<span>${fmt(byDay[k].reduce((a, e) => a + e.mg, 0))} mg</span></div><ul class="log">${byDay[k].map(row).join('')}</ul>`;
    });
    html += `</details>`;
  }
  $('#logcard').innerHTML = html;
}

function renderChips(){
  const sub = mode;
  const presets = SUBS[sub].presets.concat(S.presets[sub] || []);
  let html = presets.map((p, i) => `<button class="chip" data-add="${i}">${esc(p.name)}<small>${fmt(p.mg)} mg</small></button>`).join('');
  html += `<button class="chip custom" data-custom="1">Custom</button>`;
  $('#chips').innerHTML = html;
  const form = $('#customForm');
  if (!form.dataset.built) {
    form.innerHTML = `<div class="row"><input type="text" id="cName" placeholder="What was it"><input type="number" id="cMg" placeholder="mg" min="0" step="0.5" inputmode="decimal"></div>
      <div class="row"><input type="datetime-local" id="cTime"><button class="btn primary" id="cLog">Log it</button><button class="btn" id="cCancel">Cancel</button></div>`;
    form.dataset.built = '1';
  }
}

function renderSettings(){
  const sub = mode, st = S.settings[sub], cfg = SUBS[sub];
  const f = (key, label, small, attrs) => `<div class="field"><label for="s_${key}">${label}<small>${small}</small></label><input id="s_${key}" data-set="${key}" ${attrs}></div>`;
  let html = '';
  html += f('taper', 'Drop per week', 'Percent the line falls each week', `type="number" min="0" max="50" step="0.5" value="${st.taper}"`);
  html += f('goal', 'Goal', `mg per ${sub === 'dph' ? 'night' : 'day'} where the line stops`, `type="number" min="0" step="1" value="${st.goal}"`);
  html += f('window', 'Average window', 'Days in the moving average and calibration', `type="number" min="3" max="14" step="1" value="${st.window}"`);
  html += f('baseline', 'Baseline', 'Leave blank to use your first days', `type="number" min="0" step="1" value="${st.baseline == null ? '' : st.baseline}" placeholder="auto"`);
  html += f('start', 'Start date', 'Leave blank to use your first entry', `type="date" value="${st.start || ''}"`);
  html += f('cutoff', 'Day rolls over at', `Hour, 0–12. ${sub === 'dph' ? 'A 1 am dose counts toward the night before.' : 'A 2 am coffee counts toward the day before.'}`, `type="number" min="0" max="12" step="1" value="${st.cutoff}"`);
  html += `<div class="field" style="display:block"><label>Add a preset<small>Something you take often, at its usual ${cfg.unit}</small></label>
    <div class="row"><input type="text" id="pName" placeholder="Name"><input type="number" id="pMg" placeholder="mg" min="0" step="0.5" inputmode="decimal"><button class="btn" id="pAdd">Add</button></div>`;
  if ((S.presets[sub] || []).length) html += `<div class="row">${S.presets[sub].map((p, i) => `<button class="btn" data-delpreset="${i}">${esc(p.name)} ${fmt(p.mg)} mg ×</button>`).join('')}</div>`;
  html += `</div>`;
  html += `<div class="field" style="display:block"><div class="row"><button class="btn" id="sample">Load 3 weeks of sample data</button><button class="btn danger" id="clear">Clear all ${cfg.label} entries</button></div><p class="hint">Sample data replaces your ${cfg.label} entries so you can see the chart working.</p></div>`;
  $('#settingsBody').innerHTML = html;
}

function renderData(){
  $('#dataBody').innerHTML = `<p class="hint" style="margin:0 0 8px">Copy this to keep a backup or move it to another device. Paste a backup below to restore it.</p>
    <textarea id="exportBox" readonly>${esc(JSON.stringify(S))}</textarea>
    <div class="row"><button class="btn" id="copyExport">Copy</button></div>
    <textarea id="importBox" placeholder="Paste a backup here" style="margin-top:12px"></textarea>
    <div class="row"><button class="btn" id="doImport">Import and replace</button></div>`;
}

// ---------- actions ----------
function toast(msg, undo){
  const t = $('#toast');
  undoFn = undo || null;
  t.innerHTML = esc(msg) + (undo ? ' <button id="undo">Undo</button>' : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); undoFn = null; }, 4500);
}
function addEntry(name, mg, ts){
  const e = { id: uid(), sub: mode, ts: ts || new Date().toISOString(), name, mg };
  S.entries.push(e); save(); render();
  toast(`Logged ${name}, ${fmt(mg)} mg`, () => { S.entries = S.entries.filter(x => x.id !== e.id); save(); render(); });
}
function removeEntry(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  S.entries = S.entries.filter(x => x.id !== id); save(); render();
  toast(`Removed ${e.name}`, () => { S.entries.push(e); save(); render(); });
}
function loadSample(){
  const sub = mode, st = S.settings[sub];
  S.entries = S.entries.filter(e => e.sub !== sub);
  const today = todayKey(sub);
  const rnd = (a, b) => a + Math.random() * (b - a);
  for (let d = 21; d >= 1; d--) {
    const k = addDays(today, -d);
    const base = parseDay(k);
    if (sub === 'caf') {
      const target = 330 * Math.pow(0.97, (21 - d) / 7) * rnd(0.8, 1.2);
      let left = target;
      const plan = [['Coffee, 8 oz', 95, 7.5], ['Espresso', 63, 10.25], ['Cold brew, 12 oz', 155, 13], ['Black tea', 47, 15.5], ['Espresso', 63, 16.5]];
      for (const [name, mg, hr] of plan) {
        if (left < mg * 0.6) break;
        const t = new Date(base); t.setHours(Math.floor(hr), Math.round((hr % 1) * 60) + Math.round(rnd(-10, 10)));
        S.entries.push({ id: uid(), sub, ts: t.toISOString(), name, mg }); left -= mg;
      }
    } else {
      const heavy = Math.random() < Math.max(0.15, 0.75 - (21 - d) * 0.03);
      const t = new Date(base); t.setHours(22, 40 + Math.round(rnd(-20, 40)));
      S.entries.push({ id: uid(), sub, ts: t.toISOString(), name: heavy ? '2 tablets' : '1 tablet', mg: heavy ? 50 : 25 });
    }
  }
  st.baseline = null; st.start = null;
  save(); render();
  toast('Sample data loaded');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.mode) { mode = t.dataset.mode; $('#customForm').classList.remove('open'); render(); return; }
  if (t.dataset.add != null) { const p = SUBS[mode].presets.concat(S.presets[mode] || [])[Number(t.dataset.add)]; if (p) addEntry(p.name, p.mg); return; }
  if (t.dataset.custom) {
    const f = $('#customForm'); f.classList.toggle('open');
    if (f.classList.contains('open')) { $('#cTime').value = localInputValue(new Date()); $('#cName').value = ''; $('#cMg').value = ''; $('#cName').focus(); }
    return;
  }
  if (t.id === 'cCancel') { $('#customForm').classList.remove('open'); return; }
  if (t.id === 'cLog') {
    const mg = parseFloat($('#cMg').value); const name = $('#cName').value.trim() || `Custom ${SUBS[mode].label.toLowerCase()}`;
    if (!(mg > 0)) { $('#cMg').focus(); return; }
    const tv = $('#cTime').value; const ts = tv ? new Date(tv).toISOString() : null;
    $('#customForm').classList.remove('open'); addEntry(name, mg, ts); return;
  }
  if (t.dataset.del) { removeEntry(t.dataset.del); return; }
  if (t.id === 'undo') { if (undoFn) undoFn(); $('#toast').classList.remove('show'); undoFn = null; return; }
  if (t.id === 'pAdd') {
    const name = $('#pName').value.trim(), mg = parseFloat($('#pMg').value);
    if (!name || !(mg > 0)) return;
    (S.presets[mode] = S.presets[mode] || []).push({ name, mg }); save(); render(); $('#settings').open = true; return;
  }
  if (t.dataset.delpreset != null) { S.presets[mode].splice(Number(t.dataset.delpreset), 1); save(); render(); $('#settings').open = true; return; }
  if (t.id === 'sample') { loadSample(); $('#settings').open = true; return; }
  if (t.id === 'clear') {
    if (!confirm(`Remove every ${SUBS[mode].label} entry? Undo is not available for this.`)) return;
    S.entries = S.entries.filter(x => x.sub !== mode); save(); render(); $('#settings').open = true; return;
  }
  if (t.id === 'copyExport') {
    const box = $('#exportBox'); box.select();
    try { navigator.clipboard.writeText(box.value); toast('Copied'); } catch(err) { document.execCommand('copy'); toast('Copied'); }
    return;
  }
  if (t.id === 'doImport') {
    try { const s = JSON.parse($('#importBox').value); S = migrate(s); save(); render(); $('#data').open = true; toast('Imported'); }
    catch(err) { toast('That did not look like a backup'); }
    return;
  }
});

document.addEventListener('change', e => {
  const key = e.target.dataset.set; if (!key) return;
  const st = S.settings[mode]; const v = e.target.value;
  if (key === 'start') st.start = v || null;
  else if (key === 'baseline') st.baseline = v === '' ? null : Math.max(0, parseFloat(v));
  else if (key === 'window') st.window = Math.min(14, Math.max(3, parseInt(v, 10) || 7));
  else if (key === 'cutoff') st.cutoff = Math.min(12, Math.max(0, parseInt(v, 10) || 0));
  else if (key === 'taper') st.taper = Math.min(50, Math.max(0, parseFloat(v) || 0));
  else if (key === 'goal') st.goal = Math.max(0, parseFloat(v) || 0);
  save(); render(); $('#settings').open = true;
});

document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'cMg') $('#cLog').click(); });

// ---------- start ----------
load();
const h = new Date().getHours();
mode = (h >= 20 || h < 4) ? 'dph' : 'caf';
render();

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(function(){});
}
})();
</script>
</body>
</html>
