<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taper</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDF0F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141D26; --muted:#66727F; --hair:#DDE3E9;
    --accent:#B8621B; --accent-ink:#FFFFFF; --line:#C63A45; --ma:#141D26; --soft:#F6EEE6;
    --glow:rgba(184,98,27,.35); --glow2:rgba(184,98,27,.12); --toast:#141D26; --toast-ink:#F4F6F8;
    --radius:18px;
  }
  body[data-mode="night"]{
    --bg:#10131F; --surface:#1A1E30; --ink:#EDEBF8; --muted:#9A9DBA; --hair:#2A2F4A;
    --accent:#A49CF5; --accent-ink:#0F1120; --line:#F2708B; --ma:#EDEBF8; --soft:#252A44;
    --glow:rgba(164,156,245,.45); --glow2:rgba(164,156,245,.14); --toast:#EDEBF8; --toast-ink:#141726;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", sans-serif;
    font-size:16px; line-height:1.4; font-variant-numeric:tabular-nums;
    transition:background-color .8s cubic-bezier(.4,0,.2,1), color .6s ease;
    padding-bottom:132px; min-height:100vh;
  }

  /* atmosphere */
  .sky{position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0; transition:opacity 1.2s cubic-bezier(.4,0,.2,1)}
  .sky.day{
    background:
      radial-gradient(70% 45% at 15% -10%, rgba(255,196,120,.55), transparent 65%),
      radial-gradient(50% 35% at 95% 5%, rgba(184,98,27,.14), transparent 60%),
      linear-gradient(180deg, #F2F0EC 0%, #EDF0F3 40%);
  }
  .sky.night{
    background:
      radial-gradient(1.2px 1.2px at 18px 26px, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 96px 74px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.4px 1.4px at 150px 20px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 60px 140px, rgba(255,255,255,.45), transparent),
      radial-gradient(1.2px 1.2px at 190px 120px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 120px 180px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 30px 90px, rgba(255,255,255,.55), transparent),
      radial-gradient(60% 45% at 85% -10%, rgba(164,156,245,.32), transparent 65%),
      radial-gradient(40% 30% at 5% 10%, rgba(242,112,139,.10), transparent 60%),
      linear-gradient(180deg, #0D1020 0%, #10131F 50%);
    background-size:210px 210px, 210px 210px, 210px 210px, 210px 210px, 210px 210px, 210px 210px, 210px 210px, 100% 100%, 100% 100%, 100% 100%;
  }
  .sky.night::after{content:""; position:absolute; inset:0; background:
      radial-gradient(1.6px 1.6px at 40px 50px, rgba(255,255,255,.9), transparent),
      radial-gradient(1.3px 1.3px at 170px 30px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 110px 160px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 240px 110px, rgba(255,255,255,.85), transparent);
    background-size:300px 300px; animation:twinkle 6s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.25} to{opacity:1}}
  body[data-mode="day"] .sky.day, body[data-mode="night"] .sky.night{opacity:1}
  .empty-art{width:150px; height:auto; display:block; margin:6px auto 0}
  .empty-art .liq{fill:var(--accent)} .empty-art .ln{fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .empty-art .taper{fill:none; stroke:var(--line); stroke-width:2.5; stroke-dasharray:5 5; stroke-linecap:round; animation:march 1.4s linear infinite}
  .empty-art .steam{opacity:.4}
  @keyframes march{to{stroke-dashoffset:-20}}

  .wrap{max-width:660px; margin:0 auto; padding:20px 16px 0}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
  .brand{font-weight:800; font-size:24px; letter-spacing:-0.02em; display:flex; align-items:center; gap:10px}
  .saved{font-size:12px; font-weight:600; color:var(--muted); opacity:0; transition:opacity .25s; letter-spacing:0}
  .saved.on{opacity:1}
  .seg{position:relative; display:flex; background:var(--surface); border:1px solid var(--hair); border-radius:999px; padding:3px; transition:background-color .5s ease, border-color .5s ease}
  .seg .pill{position:absolute; top:3px; bottom:3px; left:0; width:0; background:var(--accent); border-radius:999px; transition:transform .38s cubic-bezier(.3,.9,.3,1), width .38s cubic-bezier(.3,.9,.3,1), background-color .5s ease}
  .seg button{position:relative; z-index:1; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:700; padding:8px 16px; border-radius:999px; cursor:pointer; transition:color .3s}
  .seg button[aria-selected="true"]{color:var(--accent-ink)}
  .seg:not(.ready) button[aria-selected="true"]{background:var(--accent)}

  .card{background:var(--surface); border-radius:var(--radius); padding:18px; margin-bottom:12px; transition:background-color .8s cubic-bezier(.4,0,.2,1), box-shadow .5s ease}
  .hero{position:relative; overflow:hidden; box-shadow:0 30px 70px -40px var(--glow), 0 1px 0 var(--hair) inset}
  .hero::before{content:""; position:absolute; inset:-40% -20% auto auto; width:60%; height:70%; background:radial-gradient(closest-side, var(--glow2), transparent); pointer-events:none}
  .cap{font-size:14px; font-weight:700; color:var(--muted); margin-bottom:4px; position:relative}
  .readout{display:grid; grid-template-columns:auto 1fr; align-items:end; gap:8px 22px; position:relative}
  .dial-wrap{position:relative; width:230px; max-width:100%}
  .dial{width:100%; height:auto; display:block; overflow:visible}
  .dial .track{fill:none; stroke:var(--soft); stroke-width:14; stroke-linecap:round}
  .dial .fill{fill:none; stroke:url(#gdial); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 0 10px var(--glow))}
  .dial .fill.over{stroke:var(--line); filter:drop-shadow(0 0 10px rgba(198,58,69,.5)); stroke-linecap:butt; transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
  .dial .mark{stroke:var(--line); stroke-width:3; stroke-linecap:round}
  .dial .tick{stroke:var(--hair); stroke-width:2; stroke-linecap:round}
  .dial-wrap .big{position:absolute; left:0; right:0; bottom:-2px; text-align:center}
  .big{font-size:58px; font-weight:800; letter-spacing:-0.035em; line-height:1}
  .big small{font-size:18px; font-weight:700; color:var(--muted); margin-left:4px; letter-spacing:0}
  .dial-labels{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; padding:0 6px}
  .dial-labels .ln{color:var(--line); font-weight:800}
  .side{display:flex; flex-direction:column; gap:10px; padding-bottom:14px}
  .status{font-size:16px; color:var(--muted); line-height:1.35}
  .status strong{color:var(--ink); font-weight:800; font-size:20px}
  .status.over strong{color:var(--line)}
  .streak{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--ink); background:var(--soft); border-radius:999px; padding:6px 12px 6px 9px; width:max-content; max-width:100%}
  .streak i{width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--glow); flex:none; animation:streakPulse 2.5s ease-in-out infinite}
  @keyframes streakPulse{0%,100%{box-shadow:0 0 6px var(--glow)} 50%{box-shadow:0 0 14px var(--glow)}}
  .streak.zero{color:var(--muted)} .streak.zero i{background:var(--hair); box-shadow:none; animation:none}
  .dial-wrap.logged .dial .fill{animation:gaugeBump .4s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 0 14px var(--glow))}
  @keyframes gaugeBump{0%{stroke-width:14} 40%{stroke-width:18} 100%{stroke-width:14}}
  .status:not(.over){text-shadow:0 0 20px var(--glow2)}

  .chart-head{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; flex-wrap:wrap}
  .range{display:flex; gap:2px; background:var(--soft); border-radius:999px; padding:2px}
  .range button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer; transition:background-color .2s, color .2s}
  .range button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
  .chart-box{position:relative}
  .tip{position:absolute; top:0; left:0; pointer-events:none; background:var(--toast); color:var(--toast-ink); border-radius:12px; padding:8px 11px; font-size:12px; font-weight:600; line-height:1.4; box-shadow:0 10px 30px -10px rgba(0,0,0,.45); opacity:0; transform:translate(-50%, -8px); transition:opacity .15s; white-space:nowrap; z-index:3}
  .tip.show{opacity:1}
  .tip b{font-weight:800; font-size:13px}
  .tip .o{color:var(--line)}
  .bar.dim{opacity:.35}
  .bar.hl{opacity:1; filter:drop-shadow(0 0 8px var(--glow))}
  .hoverline{stroke:var(--ink); stroke-width:1; opacity:.35}

  svg.chart{width:100%; height:auto; display:block; margin-top:10px; overflow:visible; touch-action:pan-y; cursor:crosshair}
  .grid{stroke:var(--hair); stroke-width:1}
  .ylab,.xlab{fill:var(--muted); font-size:11px; font-family:inherit; font-weight:600}
  .xlab.today{fill:var(--ink)}
  .bar{fill:url(#gbar); transform-box:fill-box; transform-origin:50% 100%; animation:grow .5s cubic-bezier(.2,.9,.2,1) both; animation-delay:var(--d,0ms)}
  .bar.over{fill:url(#gover)}
  .bar.today{filter:drop-shadow(0 0 9px var(--glow))}
  .chart.first .bar{animation-duration:.7s}
  .area{fill:url(#garea); animation:fade .8s ease-out both; animation-delay:.25s}
  .ma{fill:none; stroke:var(--ma); stroke-width:1.8; opacity:.75; stroke-linejoin:round; stroke-linecap:round}
  .ceil{fill:none; stroke:var(--line); stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round; filter:drop-shadow(0 0 6px rgba(198,58,69,.35))}
  .ceil.calib{opacity:.3; filter:none}
  .ceil.future{stroke-dasharray:4 6; opacity:.75; filter:none; animation:fade .5s ease-out both; animation-delay:.6s}
  .drawn{stroke-dasharray:1; stroke-dashoffset:1; animation:draw .9s cubic-bezier(.3,.7,.3,1) forwards; animation-delay:.2s}
  .chart:not(.first) .drawn{animation:fade .35s ease-out both; stroke-dasharray:none; stroke-dashoffset:0; animation-delay:0s}
  .chart:not(.first) .area{animation-duration:.35s; animation-delay:0s}
  .chart:not(.first) .ceil.future{animation-delay:.1s}
  .todayline{stroke:var(--hair); stroke-width:1; stroke-dasharray:2 4}
  .today-glow{opacity:.55; animation:fade .6s ease-out both; animation-delay:.1s}
  .today-dot{fill:var(--accent); filter:drop-shadow(0 0 6px var(--glow)); animation:pulse 2s ease-in-out infinite}
  .today-ring{fill:none; stroke:var(--accent); stroke-width:1.5; opacity:.4; animation:ringPulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{r:4.5} 50%{r:6}}
  @keyframes ringPulse{0%,100%{r:8; opacity:.4} 50%{r:11; opacity:0}}
  .safe-zone{opacity:.08; animation:fade .8s ease-out both; animation-delay:.3s}
  body[data-mode="night"] .safe-zone{opacity:.06}
  .ceil-dot{fill:var(--line); opacity:.85}
  .ceil-dot.future{opacity:.4}
  .ceil.future{animation:marchForward 1.2s linear infinite, fade .5s ease-out both; animation-delay:0s, .6s}
  @keyframes marchForward{to{stroke-dashoffset:-10}}
  .milestone{font-size:9px; font-weight:800; font-family:inherit; letter-spacing:.03em}
  .milestone.label{fill:var(--line); opacity:.85}
  .milestone.pip{fill:var(--line); opacity:.7}
  .milestone.reached .pip{fill:var(--accent); opacity:1}
  .milestone.reached .label{fill:var(--accent); opacity:1}
  .milestone-line{stroke:var(--line); stroke-width:1; stroke-dasharray:2 3; opacity:.25}
  @keyframes grow{from{transform:scaleY(0)} to{transform:scaleY(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--muted); margin-top:8px; flex-wrap:wrap; font-weight:600}
  .legend i{display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:6px; border-radius:2px}
  .legend .sw-bar{background:var(--accent); height:10px; width:10px; opacity:.7; border-radius:3px}
  .legend .sw-ma{background:var(--ma); opacity:.7}
  .legend .sw-line{background:var(--line)}
  .facts{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:14px; margin-top:12px}
  .facts b{color:var(--ink); font-weight:700}
  .note{color:var(--muted); font-size:14px; margin:10px 0 0}
  .note b{color:var(--ink); font-weight:700}
  .journey{margin:14px 0 4px; padding:0 4px}
  .journey-track{position:relative; height:4px; background:var(--hair); border-radius:2px}
  .journey-fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, var(--accent), var(--line)); border-radius:2px; transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .journey-mark{position:absolute; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center}
  .journey-mark .pip{width:10px; height:10px; border-radius:50%; border:2px solid var(--hair); background:var(--surface); transition:border-color .3s, background .3s, box-shadow .3s}
  .journey-mark.reached .pip{border-color:var(--accent); background:var(--accent); box-shadow:0 0 8px var(--glow)}
  .journey-mark .lbl{position:absolute; top:12px; font-size:9px; font-weight:800; color:var(--muted); white-space:nowrap; letter-spacing:.02em}
  .journey-mark.reached .lbl{color:var(--accent)}
  .journey-mark:first-child .lbl{transform:translateX(0); left:0}
  .journey-mark:last-child .lbl{transform:translateX(0); right:0; left:auto}
  .empty-hero{margin-top:8px}
  .empty-hero .row{margin-top:14px}

  .grid2{display:grid; gap:12px}
  h2{font-size:17px; font-weight:800; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline}
  h2 span{font-weight:600; color:var(--muted); font-size:14px}
  .timeline{list-style:none; margin:0; padding:0 0 0 18px; position:relative}
  .timeline::before{content:''; position:absolute; left:7px; top:8px; bottom:8px; width:2px; background:var(--hair); border-radius:1px}
  .timeline li{position:relative; padding:8px 0 8px 20px; display:flex; align-items:center; gap:10px}
  .timeline li::before{content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%); width:8px; height:8px; border-radius:50%; border:2px solid var(--hair); background:var(--surface); z-index:1; transition:border-color .3s, background .3s, box-shadow .3s}
  .timeline li.new{animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both}
  .timeline li.new::before{border-color:var(--accent); background:var(--accent); box-shadow:0 0 8px var(--glow)}
  @keyframes rowIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  .timeline li[data-pct="low"]::before{border-color:var(--accent); background:var(--accent); opacity:.5}
  .timeline li[data-pct="med"]::before{border-color:var(--accent); background:var(--accent); opacity:.75}
  .timeline li[data-pct="high"]::before{border-color:var(--accent); background:var(--accent)}
  .timeline li[data-pct="over"]::before{border-color:var(--line); background:var(--line); box-shadow:0 0 6px rgba(198,58,69,.4)}
  .timeline .t{color:var(--muted); width:60px; flex:none; font-size:13px; font-weight:600}
  .timeline .n{flex:1; font-weight:600}
  .timeline .mg{font-weight:700; font-size:14px}
  .x{border:0; background:transparent; color:var(--muted); font-size:22px; line-height:1; width:34px; height:34px; border-radius:10px; cursor:pointer; transition:background-color .15s, color .15s, transform .15s}
  .x:hover{background:var(--soft); color:var(--ink)}
  .x:active{transform:scale(.85)}
  .empty{color:var(--muted); font-size:14px; padding:6px 0}
  .dayhead{font-weight:700; margin:12px 0 2px; display:flex; justify-content:space-between}
  .dayhead span{color:var(--muted); font-weight:600}
  .smart-moment{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; background:var(--soft); font-size:14px; font-weight:600; color:var(--ink); margin:10px 0 6px; animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
  .smart-moment .emoji{font-size:18px; flex:none}
  .smart-moment.over{background:rgba(198,58,69,.08); color:var(--line)}
  .smart-moment.winning{background:rgba(184,98,27,.08)}
  body[data-mode="night"] .smart-moment.winning{background:rgba(164,156,245,.1)}
  @keyframes slideIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}

  details{background:var(--surface); border-radius:var(--radius); margin-bottom:12px; transition:background-color .5s ease}
  details summary{cursor:pointer; padding:16px 18px; font-weight:800; font-size:17px; list-style:none; display:flex; justify-content:space-between; align-items:center}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+"; color:var(--muted); font-weight:600; font-size:22px; transition:transform .25s}
  details[open] summary::after{transform:rotate(45deg)}
  details .body{padding:0 18px 18px}
  .field{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--hair)}
  .field:first-child{border-top:0}
  .field label{flex:1; font-weight:600}
  .field label small{display:block; color:var(--muted); font-size:13px; font-weight:500}
  input[type=number],input[type=text],input[type=date],input[type=datetime-local],textarea{
    font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--hair); border-radius:10px; padding:9px 11px; transition:border-color .2s, box-shadow .2s;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--glow2); outline:none}
  .field input{width:122px}
  textarea{width:100%; min-height:90px; font-size:12px; font-family:ui-monospace, monospace}
  .btn{font:inherit; font-weight:700; border:1px solid var(--hair); background:var(--surface); color:var(--ink); border-radius:12px; padding:10px 15px; cursor:pointer; transition:transform .3s cubic-bezier(.175,.885,.32,1.275), background-color .2s}
  .btn:active{transform:scale(.94); transition:transform .06s ease-out}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:0 8px 20px -10px var(--glow)}
  .btn.danger{color:var(--line)}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .row input{flex:1; min-width:90px}
  .hint{color:var(--muted); font-size:13px; margin:8px 0 0}

  .tray{position:fixed; left:0; right:0; bottom:0; z-index:5; background:linear-gradient(to top, var(--bg) 70%, transparent); padding:22px 0 max(14px, env(safe-area-inset-bottom)); transition:background .8s cubic-bezier(.4,0,.2,1)}
  .tray .inner{max-width:660px; margin:0 auto; padding:0 16px}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:6px 0 6px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; font:inherit; font-weight:700; cursor:pointer;
    background:var(--surface); color:var(--ink); border:1.5px solid var(--hair); border-radius:999px; padding:11px 16px;
    display:flex; flex-direction:row; align-items:center; gap:10px; line-height:1.1;
    box-shadow:0 6px 18px -12px rgba(0,0,0,.35);
    transition:transform .12s cubic-bezier(.2,.8,.2,1), border-color .2s, background-color .5s;
  }
  .chip .txt{display:flex; flex-direction:column; align-items:flex-start; gap:2px}
  .chip small{font-weight:600; color:var(--muted); font-size:12px}
  .ico{width:30px; height:30px; flex:none; color:var(--ink)}
  .ico .liq{fill:var(--liq, var(--accent)); opacity:.95}
  body[data-mode="night"] .ico .liq{stroke:rgba(255,255,255,.28); stroke-width:1}
  .ico .liq.ring{fill:var(--surface) !important; stroke:var(--liq, var(--accent)) !important; stroke-width:2.2}
  .ico .ln{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .ico .ln.thin{stroke-width:1.2; opacity:.55}
  .ico .ln.dash{stroke-dasharray:2 2.5; opacity:.5}
  .ico .steam{opacity:.45; animation:steamDrift 2.5s ease-in-out infinite alternate}
  @keyframes steamDrift{0%{transform:translateY(0) scaleX(1); opacity:.45} 100%{transform:translateY(-1.5px) scaleX(1.1); opacity:.25}}
  .ico .liq{transition:opacity .3s}
  .chip:active .ico .liq{animation:liquidPulse .3s ease-out}
  @keyframes liquidPulse{0%{opacity:.95} 50%{opacity:1; filter:brightness(1.2)} 100%{opacity:.95}}
  .ico .ice{fill:#fff; opacity:.85}
  .ico .ice-ln{fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; opacity:.85}
  .chip:hover .ico{transform:translateY(-1px)}

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

const SUBS = {
  caf: {
    label:'Caffeine', snap:20, minAxis:100, icons:['espresso','mug','coldbrew','can','bigcan','tea','soda','cup'],
    drinks:[
      {name:'Espresso', mg:63, icon:'espresso'}, {name:'Coffee, 8 oz', mg:95, icon:'mug'}, {name:'Cold brew, 12 oz', mg:155, icon:'coldbrew'},
      {name:'Red Bull, 8.4 oz', mg:80, icon:'can'}, {name:'Monster, 16 oz', mg:160, icon:'bigcan'}, {name:'Black tea', mg:47, icon:'tea'},
      {name:'Green tea', mg:28, icon:'tea'}, {name:'Cola, 12 oz', mg:34, icon:'soda'}
    ],
    defaults:{ taper:4.5, goal:95, window:7, baseline:null, start:null, cutoff:4 }
  },
  dph: {
    label:'Benadryl', snap:0.5, minAxis:2, icons:['quarter','half','threeq','tablet','onehalf','two'],
    drinks:[
      {name:'¼ pill', pills:0.25, icon:'quarter'}, {name:'½ pill', pills:0.5, icon:'half'}, {name:'¾ pill', pills:0.75, icon:'threeq'},
      {name:'1 pill', pills:1, icon:'tablet'}, {name:'1½ pills', pills:1.5, icon:'onehalf'}, {name:'2 pills', pills:2, icon:'two'}
    ],
    defaults:{ taper:5.5, goal:0, window:7, baseline:null, start:null, cutoff:12, tabMg:25 }
  }
};
// ---------- units: entries and settings are stored in mg; Benadryl is shown in pills ----------
function per(sub){ return sub === 'dph' ? (Number(S.settings.dph.tabMg) || 25) : 1; }
function toU(sub, mg){ return mg == null ? null : mg / per(sub); }
function toMg(sub, u){ return u == null ? null : u * per(sub); }
function unitName(sub, u){ return sub === 'dph' ? ((u > 0.001 && u <= 1.001) ? 'pill' : 'pills') : 'mg'; }
function fmtU(sub, mg){ const u = toU(sub, mg); if (u == null || isNaN(u)) return '–'; return sub === 'dph' ? fmtPills(u) : fmt(u); }
function fmtPills(u){
  const q = Math.round(u * 4);
  if (Math.abs(u * 4 - q) < 0.01) { const w = Math.floor(q / 4), f = ['', '¼', '½', '¾'][q % 4]; return w === 0 ? (f || '0') : (w + f); }
  return (Math.round(u * 10) / 10).toString();
}
function withUnit(sub, mg){ return `${fmtU(sub, mg)} ${unitName(sub, toU(sub, mg))}`; }
function drinkMg(sub, d){ return d.mg != null ? d.mg : toMg(sub, d.pills || 0); }
const KEY = 'taper:state';
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwt438APIycBc534W6T66O3IgtxLUU9cczw-PZAN6Mc9p2xfU2ySsND_wEMJDHUvrXyUg/exec';

let S = null;
let mode = 'caf';
let toastTimer = null;
let undoFn = null;
let lastChartSub = null;
const bigPrev = { caf:null, dph:null };
const gaugePrev = { caf:0, dph:0 };
let range = 28;
let chartMeta = null;
let newEntryId = null;
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { if (n == null || isNaN(n)) return '–'; const r = Math.round(n*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ---------- dates ----------
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ const d = parseDay(k); d.setDate(d.getDate()+n); return fmtDate(d); }
function daysBetween(a, b){ return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
function dayKey(ts, cutoff){ const d = new Date(ts); d.setHours(d.getHours() - cutoff); return fmtDate(d); }
function todayKey(sub){ return dayKey(Date.now(), S.settings[sub].cutoff); }
function shortDate(k){ return parseDay(k).toLocaleDateString([], {month:'short', day:'numeric'}); }
function longDate(k){ return parseDay(k).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}); }
function timeOf(ts){ return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function localInputValue(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }

// ---------- storage ----------
function seedDrinks(sub){ return SUBS[sub].drinks.map(d => ({ id: uid(), name: d.name, mg: d.mg != null ? d.mg : d.pills * 25, icon: d.icon })); }
function defaultState(){
  return { version:4, entries:[], deletedIds:[], drinks:{ caf:seedDrinks('caf'), dph:seedDrinks('dph') },
    settings:{ caf:Object.assign({}, SUBS.caf.defaults), dph:Object.assign({}, SUBS.dph.defaults) } };
}
function migrate(s){
  const d = defaultState();
  const out = {
    version:4,
    entries: Array.isArray(s.entries) ? s.entries : [],
    deletedIds: Array.isArray(s.deletedIds) ? s.deletedIds : [],
    drinks: { caf: [], dph: [] },
    settings: {
      caf: Object.assign({}, d.settings.caf, (s.settings||{}).caf||{}),
      dph: Object.assign({}, d.settings.dph, (s.settings||{}).dph||{})
    }
  };
  if ((s.version || 1) < 2) {
    // v1 shipped with fixed baselines that squashed the chart; back to auto
    if (out.settings.caf.baseline === 1000) out.settings.caf.baseline = null;
    if (out.settings.dph.baseline === 100) out.settings.dph.baseline = null;
  }
  ['caf', 'dph'].forEach(sub => {
    const have = s.drinks && Array.isArray(s.drinks[sub]) ? s.drinks[sub] : null;
    if (have) { out.drinks[sub] = have.filter(x => x && x.name && x.mg > 0).map(x => ({ id: x.id || uid(), name: x.name, mg: Number(x.mg), icon: x.icon })); }
    else {
      // first run on v3: seed the tray with the built-ins plus any presets the user had added
      out.drinks[sub] = seedDrinks(sub);
      const extra = (s.presets && Array.isArray(s.presets[sub])) ? s.presets[sub] : [];
      extra.forEach(x => { if (x && x.name && x.mg > 0) out.drinks[sub].push({ id: uid(), name: x.name, mg: Number(x.mg), icon: x.icon }); });
    }
  });
  return out;
}
// ---- sync helpers ----
function fireGet(url){ var img = new Image(); img.src = url; }
function jsonpFetch(url, cb){
  const cbName = '_tpCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const script = document.createElement('script');
  let done = false, timer;
  function finish(err, resp){
    if (done) return; done = true; clearTimeout(timer);
    delete window[cbName]; if (script.parentNode) script.remove();
    cb(err, resp);
  }
  window[cbName] = function(resp){ finish(null, resp); };
  timer = setTimeout(function(){ finish('timeout'); }, 12000);
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  script.onerror = function(){ finish('network'); };
  document.head.appendChild(script);
}

function load(){
  let s = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) s = JSON.parse(raw);
  } catch(e) {}
  S = s ? migrate(s) : defaultState();
  // Pull cloud data in background, merge respecting deletedIds
  jsonpFetch(SYNC_URL + '?action=taper_get', function(err, resp){
    if (err || !resp || resp.status !== 'ok' || !resp.taper) return;
    try {
      const cloud = migrate(resp.taper);
      if (!S.entries.length && !S.deletedIds.length) {
        // Empty local — take cloud wholesale
        S = cloud; saveLocal(); render(); return;
      }
      // Merge deletedIds from both sides
      const delSet = new Set(S.deletedIds);
      (cloud.deletedIds || []).forEach(id => delSet.add(id));
      S.deletedIds = Array.from(delSet);
      // Merge entries: union minus anything deleted on either side
      const localIds = new Set(S.entries.map(e => e.id));
      cloud.entries.forEach(e => { if (!localIds.has(e.id) && !delSet.has(e.id)) S.entries.push(e); });
      S.entries = S.entries.filter(e => !delSet.has(e.id));
      // Merge drinks, settings — prefer local if modified, cloud if local is default
      ['caf','dph'].forEach(sub => {
        if (!S.drinks[sub].length && cloud.drinks[sub].length) S.drinks[sub] = cloud.drinks[sub];
      });
      saveLocal(); render();
    } catch(e) { console.warn('Cloud merge failed', e); }
  });
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}
let saveTimer = null, savedTimer = null;
function flashSaved(){
  const el = $('#saved'); if (!el) return;
  el.classList.add('on'); clearTimeout(savedTimer);
  savedTimer = setTimeout(() => el.classList.remove('on'), 1400);
}
function save(){
  saveLocal();
  flashSaved();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    const encoded = encodeURIComponent(JSON.stringify(S));
    if (encoded.length < 7000) {
      fireGet(SYNC_URL + '?action=taper_save&data=' + encoded);
    } else {
      // Chunked save for large datasets
      const data = JSON.stringify(S);
      const chunkSize = 5000;
      const chunks = [];
      for (let i = 0; i < data.length; i += chunkSize) chunks.push(data.slice(i, i + chunkSize));
      let idx = 0;
      function sendChunk(){
        if (idx >= chunks.length) {
          jsonpFetch(SYNC_URL + '?action=taper_save_done&n=' + chunks.length, function(){});
          return;
        }
        jsonpFetch(SYNC_URL + '?action=taper_save_chunk&i=' + idx + '&cd=' + encodeURIComponent(chunks[idx]), function(){ idx++; sendChunk(); });
      }
      sendChunk();
    }
  }, 500);
}

// ---------- model ----------
function series(sub){
  const st = S.settings[sub], cfg = SUBS[sub];
  const totals = {};
  S.entries.filter(e => e.sub === sub).forEach(e => { const k = dayKey(e.ts, st.cutoff); totals[k] = (totals[k]||0) + e.mg; });
  const keys = Object.keys(totals).sort();
  const today = todayKey(sub);
  let start = st.start || keys[0] || null;
  const out = { today, start, days:[], chart:[], baseline:null, calibrating:false, completed:0, goalDate:null, atGoal:false };
  if (!start) return out;
  if (start > today) start = today;
  out.start = start;

  const n = daysBetween(start, today);
  const days = [];
  for (let i = 0; i <= n; i++){ const k = addDays(start, i); days.push({ k, i, total: totals[k]||0, isToday: i === n }); }

  const manual = st.baseline != null && st.baseline !== '';
  let baseline, lockDay = 0, calibrating = false;
  const completed = days.slice(0, days.length - 1);
  out.completed = completed.length;
  if (manual) { baseline = Number(st.baseline); lockDay = 0; }
  else {
    lockDay = st.window;
    if (completed.length >= st.window) baseline = mean(completed.slice(0, st.window).map(d => d.total));
    else { calibrating = true; baseline = completed.length ? mean(completed.map(d => d.total)) : days[days.length-1].total; }
  }
  const r = 1 - st.taper/100;
  const floor = Math.max(0, Number(st.goal) || 0);
  const snapAt = floor < cfg.snap ? cfg.snap : null;
  const ceil = i => {
    if (baseline == null) return null;
    let c = i < lockDay ? baseline : baseline * Math.pow(r, (i - lockDay) / 7);
    if (c < floor) c = floor;
    if (snapAt != null && c < snapAt) c = floor;
    return c;
  };
  days.forEach((d, i) => {
    const w = days.slice(Math.max(0, i - st.window + 1), i + 1);
    d.ma = mean(w.map(x => x.total));
    d.ceil = calibrating && !manual ? baseline : ceil(i);
    d.calib = !manual && i < lockDay;
  });

  let streak = 0;
  if (!calibrating) for (let i = days.length - 2; i >= 0; i--) { const d = days[i]; if (d.calib || d.ceil == null || d.total > d.ceil + 0.01) break; streak++; }
  out.streak = streak;

  const target = Math.max(floor, snapAt != null ? snapAt : floor);
  if (!calibrating && baseline != null) {
    if (baseline <= target) out.atGoal = true;
    else if (r < 1 && r > 0) {
      const weeks = Math.log(target / baseline) / Math.log(r);
      out.goalDate = addDays(start, lockDay + Math.ceil(weeks * 7));
    }
  }

  const from = range === Infinity ? 0 : Math.max(0, n - (range - 1));
  const chart = days.slice(from).map(d => Object.assign({}, d, { future:false }));
  for (let f = 1; f <= 7; f++) chart.push({ k: addDays(today, f), i: n + f, total:null, ma:null, ceil: calibrating ? baseline : ceil(n + f), future:true, isToday:false });

  out.days = days; out.chart = chart; out.baseline = baseline; out.calibrating = calibrating;
  return out;
}


// ---------- icons ----------
const ICONS = {
  espresso: '<path d="M7 11h13v6.5a6.5 6.5 0 0 1-13 0z" class="liq"/><path d="M20 13h2.2a3 3 0 0 1 0 6H20" class="ln"/><path d="M5 26h22" class="ln"/><path d="M11 4.5c0 2-2 2-2 4M15.5 4.5c0 2-2 2-2 4" class="ln steam"/>',
  mug: '<path d="M7 8h15v12.5a5.5 5.5 0 0 1-5.5 5.5h-4A5.5 5.5 0 0 1 7 20.5z" class="liq"/><path d="M22 11h2.5a3.5 3.5 0 0 1 0 7H22" class="ln"/><path d="M12 2.5c0 2-2 2-2 4M17 2.5c0 2-2 2-2 4" class="ln steam"/>',
  coldbrew: '<path d="M9.5 6h13l-1.4 19.5a2 2 0 0 1-2 1.5h-6.2a2 2 0 0 1-2-1.5z" class="liq"/><rect x="12" y="11" width="4" height="4" rx="1" class="ice"/><rect x="16.5" y="16.5" width="4" height="4" rx="1" class="ice"/><path d="M18.5 3.5l3-1M18.5 3.5l-2.5 19" class="ln"/>',
  can: '<rect x="10.5" y="5" width="11" height="22" rx="3" class="liq"/><path d="M10.5 9h11M10.5 23h11" class="ln thin"/><path d="M17.5 10l-4 6.5h3.2l-1.5 5.5 4.8-7.5h-3.2z" class="ice"/>',
  bigcan: '<rect x="9" y="3.5" width="14" height="25" rx="3.5" class="liq"/><path d="M9 8h14M9 24h14" class="ln thin"/><path d="M14 11l2 4.5M17.5 11l-2 4.5M15.5 16v5" class="ln ice-ln"/>',
  tea: '<path d="M6 12h17v5.5a7 7 0 0 1-14 0V12z" class="liq"/><path d="M23 14h2a3 3 0 0 1 0 6h-2.5" class="ln"/><path d="M14 12V7" class="ln thin"/><rect x="11.5" y="3.5" width="5" height="4" rx="1" class="ln thin"/><path d="M4 27h22" class="ln"/>',
  soda: '<rect x="10" y="6" width="12" height="21" rx="3" class="liq"/><path d="M10 10h12" class="ln thin"/><circle cx="14" cy="16" r="1.4" class="ice"/><circle cx="18" cy="20" r="1.8" class="ice"/><circle cx="17.5" cy="14" r="1" class="ice"/>',
  tablet: '<circle cx="16" cy="16" r="9.5" class="liq"/><path d="M8 16h16" class="ice-ln"/>',
  half: '<path d="M16 6.5a9.5 9.5 0 0 1 0 19z" class="liq"/><path d="M16 6.5a9.5 9.5 0 0 0 0 19" class="ln dash"/>',
  quarter: '<path d="M16 16V6.5a9.5 9.5 0 0 1 9.5 9.5z" class="liq"/><path d="M25.5 16a9.5 9.5 0 1 1-9.5-9.5" class="ln dash"/>',
  threeq: '<path d="M16 16V6.5a9.5 9.5 0 1 1-9.5 9.5z" class="liq"/><path d="M6.5 16a9.5 9.5 0 0 1 9.5-9.5" class="ln dash"/>',
  onehalf: '<circle cx="11.5" cy="13" r="7.5" class="liq"/><path d="M21 11.5a7.5 7.5 0 0 1 0 15z" class="liq ring2"/><path d="M21 11.5a7.5 7.5 0 0 0 0 15" class="ln dash"/>',
  two: '<circle cx="12" cy="13" r="7.5" class="liq"/><circle cx="20" cy="19" r="7.5" class="liq ring"/><path d="M14.5 19h11" class="ice-ln"/>',
  pencil: '<path d="M6 26l1.5-6L21 6.5l4.5 4.5L12 24.5z" class="ln"/><path d="M18 9.5l4.5 4.5" class="ln thin"/>',
  check: '<path d="M7 17l6 6L26 9" class="ln"/>',
  custom: '<path d="M16 7v18M7 16h18" class="ln"/>',
  cup: '<path d="M7 8h15v12.5a5.5 5.5 0 0 1-5.5 5.5h-4A5.5 5.5 0 0 1 7 20.5z" class="liq"/><path d="M22 11h2.5a3.5 3.5 0 0 1 0 7H22" class="ln"/>'
};
const ICON_COLORS = { espresso:'#4A2A16', mug:'#8A5530', cup:'#8A5530', coldbrew:'#3B2517', can:'#2E6FA8', bigcan:'#3E7F7A', tea:'#C48A2C', soda:'#A8413B', tablet:'#E48CA0', half:'#E48CA0', quarter:'#E48CA0', threeq:'#E48CA0', onehalf:'#E48CA0', two:'#E48CA0' };
function icon(key){ const c = ICON_COLORS[key]; return `<svg class="ico" viewBox="0 0 32 32" aria-hidden="true"${c ? ` style="--liq:${c}"` : ''}>${ICONS[key] || ICONS.cup}</svg>`; }
function iconFor(e, sub){
  if (e.icon && ICONS[e.icon]) return e.icon;

    <linearGradient id="gtodayglow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent); stop-opacity:.18"/><stop offset=".7" style="stop-color:var(--accent); stop-opacity:.04"/><stop offset="1" style="stop-color:var(--accent); stop-opacity:0"/></linearGradient>

function smartMoment(sub, todayTotal, ceil, streak){

  } else if (pct > 1) {
    emoji = '📍'; msg = `Over the line by ${withUnit(sub, todayTotal - ceil)}. Tomorrow is a fresh start.`; cls = ' over';
  } else if (pct > 0.85) {
    emoji = '⚡'; msg = `Getting close — ${withUnit(sub, left)} remaining.`;
  } else if (pct > 0.4) {
    emoji = '👍'; msg = `${withUnit(sub, left)} left under today's line.`;
  } else if (streak >= 7) {
    emoji = '🔥'; msg = `${streak} day streak. Keep it going.`; cls = ' winning';
  } else if (streak >= 3) {
    emoji = '🎯'; msg = `${streak} days under the line in a row.`; cls = ' winning';
  } else {
    emoji = '✅'; msg = `On track. ${withUnit(sub, left)} left today.`;

}

  const mine = S.entries.filter(e => e.sub === sub).sort((a, b) => b.ts.localeCompare(a.ts));
  const byDay = {};
  mine.forEach(e => { const k = dayKey(e.ts, st.cutoff); (byDay[k] = byDay[k] || []).push(e); });
  const todays = (byDay[today] || []).sort((a,b) => a.ts.localeCompare(b.ts));
  const todayTotal = todays.reduce((a, e) => a + e.mg, 0);
  // compute running total for budget indicator
  const ser = series(sub);
  const todayDay = ser.days[ser.days.length - 1];
  const ceil = todayDay ? todayDay.ceil : null;
  const row = (e, runTotal) => {
    let pct = 'low';
    if (ceil != null && ceil > 0) {
      const ratio = runTotal / ceil;
      if (ratio > 1) pct = 'over';
      else if (ratio > 0.75) pct = 'high';
      else if (ratio > 0.4) pct = 'med';
    }
    return `<li data-pct="${pct}"${e.id === newEntryId ? ' class="new"' : ''}><span class="t">${timeOf(e.ts)}</span>${icon(iconFor(e, sub))}<span class="n">${esc(e.name)}</span><span class="mg">${withUnit(sub, e.mg)}</span><button class="x" data-del="${e.id}" aria-label="Remove ${esc(e.name)}">×</button></li>`;
  };
  let html = `<h2>Today <span>${todays.length ? withUnit(sub, todayTotal) : ''}</span></h2>`;
  // smart moment
  html += smartMoment(sub, todayTotal, ceil, ser.streak || 0);
  if (todays.length) {
    let running = 0;
    html += `<ul class="timeline">${todays.map(e => { running += e.mg; return row(e, running); }).join('')}</ul>`;
  } else {
    html += `<p class="empty">Nothing logged yet today.</p>`;
  }
  const earlier = Object.keys(byDay).filter(k => k !== today).sort().reverse().slice(0, 14);
  if (earlier.length) {
    html += `<details style="margin:10px 0 0; background:transparent"><summary style="padding:6px 0; font-size:15px; font-weight:700; color:var(--muted)">Earlier days</summary>`;
    earlier.forEach(k => {
      const dayEntries = byDay[k].sort((a,b) => a.ts.localeCompare(b.ts));
      let running = 0;
      html += `<div class="dayhead">${longDate(k)}<span>${withUnit(sub, dayEntries.reduce((a, e) => a + e.mg, 0))}</span></div><ul class="timeline">${dayEntries.map(e => { running += e.mg; return row(e, running); }).join('')}</ul>`;
    });
    html += `</details>`;
  }
  $('#logcard').innerHTML = html;
  newEntryId = null;
}

let editing = false;
let formState = null; // { id: null | drinkId }
function renderChips(){
  const sub = mode;
  const drinks = S.drinks[sub] || [];
  let html = drinks.map(d => `<button class="chip${editing ? ' editing' : ''}" data-drink="${d.id}">${icon(d.icon || 'cup')}<span class="txt">${esc(d.name)}${d.name.trim() === withUnit(sub, d.mg) ? '' : `<small>${withUnit(sub, d.mg)}</small>`}</span>${editing ? `<span class="del" data-deldrink="${d.id}" role="button" aria-label="Delete ${esc(d.name)}">×</span>` : ''}</button>`).join('');
  html += `<button class="chip custom" data-new="1">${icon('custom')}<span class="txt">New${sub === 'dph' ? ' dose' : ' drink'}</span></button>`;
  html += `<button class="chip custom${editing ? ' on' : ''}" data-edit="1">${icon(editing ? 'check' : 'pencil')}<span class="txt">${editing ? 'Done' : 'Edit'}</span></button>`;
  $('#chips').innerHTML = html;
  if (!formState) { $('#customForm').classList.remove('open'); $('#customForm').innerHTML = ''; }
}
function openForm(drink){
  const sub = mode;
  formState = { id: drink ? drink.id : null };
  const iconsRow = SUBS[sub].icons.map(k => `<button type="button" class="icopick${(drink ? drink.icon : SUBS[sub].icons[0]) === k ? ' on' : ''}" data-pick="${k}" aria-label="${k}">${icon(k)}</button>`).join('');
  const amount = drink ? (sub === 'dph' ? toU(sub, drink.mg) : drink.mg) : '';
  const f = $('#customForm');
  f.innerHTML = `<div class="form-title">${drink ? 'Edit' : 'New'} ${sub === 'dph' ? 'dose' : 'drink'}</div>
    <div class="row"><input type="text" id="fName" placeholder="Name" value="${drink ? esc(drink.name) : ''}"><input type="number" id="fAmt" placeholder="${sub === 'dph' ? 'pills' : 'mg'}" min="0" step="${sub === 'dph' ? 0.25 : 1}" inputmode="decimal" value="${amount}"></div>
    <div class="icorow">${iconsRow}</div>
    ${drink ? '' : `<div class="row"><label class="when"><span>Log at</span><input type="datetime-local" id="fTime"></label></div>`}
    <div class="row">
      <button class="btn primary" id="fSave">${drink ? 'Save' : 'Save to tray and log it'}</button>
      ${drink ? `<button class="btn danger" id="fDelete">Delete</button>` : `<button class="btn" id="fOnce">Log once</button>`}
      <button class="btn" id="fCancel">Cancel</button>
    </div>`;
  f.dataset.icon = drink ? (drink.icon || SUBS[sub].icons[0]) : SUBS[sub].icons[0];
  f.classList.add('open');
  const t = $('#fTime'); if (t) t.value = localInputValue(new Date());
  $('#fName').focus();
}
function closeForm(){ formState = null; const f = $('#customForm'); f.classList.remove('open'); f.innerHTML = ''; }
function readForm(){
  const sub = mode;
  const name = $('#fName').value.trim();
  const amt = parseFloat($('#fAmt').value);
  if (!(amt > 0)) { $('#fAmt').focus(); return null; }
  const mg = sub === 'dph' ? toMg(sub, Math.round(amt * 4) / 4) : amt;
  const icon = $('#customForm').dataset.icon || SUBS[sub].icons[0];
  const fallback = sub === 'dph' ? `${fmtPills(toU(sub, mg))} ${unitName(sub, toU(sub, mg))}` : `${fmt(mg)} mg`;
  return { name: name || fallback, mg, icon };
}

function renderSettings(){
  const sub = mode, st = S.settings[sub], cfg = SUBS[sub];
  const f = (key, label, small, attrs) => `<div class="field"><label for="s_${key}">${label}<small>${small}</small></label><input id="s_${key}" data-set="${key}" ${attrs}></div>`;
  let html = '';
  html += f('taper', 'Drop per week', 'Percent the line falls each week', `type="number" min="0" max="50" step="0.5" value="${st.taper}"`);
  html += f('goal', 'Goal', `${sub === 'dph' ? 'Pills' : 'mg'} per ${sub === 'dph' ? 'night' : 'day'} where the line stops`, `type="number" min="0" step="${sub === 'dph' ? 0.25 : 1}" value="${sub === 'dph' ? toU(sub, st.goal) : st.goal}"`);
  html += f('window', 'Average window', 'Days in the moving average and calibration', `type="number" min="3" max="14" step="1" value="${st.window}"`);
  html += f('baseline', 'Baseline', `Leave blank to use your first days${sub === 'dph' ? ', in pills' : ''}`, `type="number" min="0" step="${sub === 'dph' ? 0.25 : 1}" value="${st.baseline == null ? '' : (sub === 'dph' ? toU(sub, st.baseline) : st.baseline)}" placeholder="auto"`);
  if (sub === 'dph') html += f('tabMg', 'Tablet strength', 'mg in one pill, so history stays exact if you switch', `type="number" min="1" step="1" value="${st.tabMg || 25}"`);
  html += f('start', 'Start date', 'Leave blank to use your first entry', `type="date" value="${st.start || ''}"`);
  html += f('cutoff', 'Day rolls over at', `Hour, 0–12. ${sub === 'dph' ? 'A 1 am dose counts toward the night before.' : 'A 2 am coffee counts toward the day before.'}`, `type="number" min="0" max="12" step="1" value="${st.cutoff}"`);
  html += `<div class="field" style="display:block"><label>Tray<small>Use New and Edit in the tray to add, change, or delete ${sub === 'dph' ? 'doses' : 'drinks'}. This puts the built-ins back.</small></label><div class="row"><button class="btn" id="resetDrinks">Restore default ${sub === 'dph' ? 'doses' : 'drinks'}</button></div></div>`;
  html += `<div class="field" style="display:block"><div class="row"><button class="btn" data-action="sample">Load 3 weeks of sample data</button><button class="btn danger" id="clear">Clear all ${cfg.label} entries</button></div><p class="hint">Sample data replaces your ${cfg.label} entries so you can see the chart working.</p></div>`;
  $('#settingsBody').innerHTML = html;
}

function renderData(){
  $('#dataBody').innerHTML = `<p class="hint" style="margin:0 0 8px">Everything, including your tray, saves on this device automatically and syncs to your sheet. This is a manual backup on top of that.</p>
    <textarea id="exportBox" readonly>${esc(JSON.stringify(S))}</textarea>
    <div class="row"><button class="btn" id="copyExport">Copy</button></div>
    <textarea id="importBox" placeholder="Paste a backup here" style="margin-top:12px"></textarea>
    <div class="row"><button class="btn" id="doImport">Import and replace</button></div>`;
}

// ---------- actions ----------
function toast(msg, undo){
  const t = $('#toast');
  undoFn = undo || null;
  t.innerHTML = esc(msg) + (undo ? ' <button id="undo">Undo</button>' : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); undoFn = null; }, 4500);
}
function spawnFloat(x, y, text){
  if (reduced) return;
  const el = document.createElement('div'); el.className = 'float'; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function celebrate(cx, cy){
  if (reduced) return;
  const colors = ['var(--accent)', 'var(--line)', '#FFD700', '#4CAF50', '#FF6B9D'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;z-index:9;pointer-events:none;width:6px;height:6px;border-radius:50%;background:${colors[i%colors.length]};left:${cx}px;top:${cy}px;`;
    const angle = (i / 18) * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 30;
    el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) scale(0)`, opacity: 0 }
    ], { duration: 700 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
}
function addEntry(name, mg, ts, iconKey){
  const e = { id: uid(), sub: mode, ts: ts || new Date().toISOString(), name, mg, icon: iconKey };
  S.entries.push(e); newEntryId = e.id; save(); render();
  // gauge bump
  const dw = $('.dial-wrap'); if (dw) { dw.classList.add('logged'); setTimeout(() => dw.classList.remove('logged'), 500); }
  toast(`Logged ${name}, ${withUnit(mode, mg)}`, () => { S.entries = S.entries.filter(x => x.id !== e.id); save(); render(); });
}
function deleteDrink(id){
  const list = S.drinks[mode]; const i = list.findIndex(d => d.id === id); if (i < 0) return;
  const d = list[i]; list.splice(i, 1); save(); render();
  toast(`Removed ${d.name} from the tray`, () => { S.drinks[mode].splice(Math.min(i, S.drinks[mode].length), 0, d); save(); render(); });
}
function removeEntry(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  S.entries = S.entries.filter(x => x.id !== id);
  S.deletedIds.push(id);
  save(); render();
  toast(`Removed ${e.name}`, () => {
    S.deletedIds = S.deletedIds.filter(x => x !== id);
    S.entries.push(e); save(); render();
  });
}
function loadSample(){
  const sub = mode, st = S.settings[sub];
  S.entries = S.entries.filter(e => e.sub !== sub);
  const today = todayKey(sub);
  const rnd = (a, b) => a + Math.random() * (b - a);
  for (let d = 21; d >= 1; d--) {
    const k = addDays(today, -d);
    const base = parseDay(k);
    if (sub === 'caf') {
      const target = 330 * Math.pow(0.97, (21 - d) / 7) * rnd(0.8, 1.2);
      let left = target;
      const plan = [['Coffee, 8 oz', 95, 7.5], ['Espresso', 63, 10.25], ['Cold brew, 12 oz', 155, 13], ['Black tea', 47, 15.5], ['Espresso', 63, 16.5]];
      for (const [name, mg, hr] of plan) {
        if (left < mg * 0.6) break;
        const t = new Date(base); t.setHours(Math.floor(hr), Math.round((hr % 1) * 60) + Math.round(rnd(-10, 10)));
        const dd = (S.drinks.caf || []).find(x => x.name === name);
        S.entries.push({ id: uid(), sub, ts: t.toISOString(), name, mg, icon: dd ? dd.icon : 'cup' }); left -= mg;
      }
    } else {
      const heavy = Math.random() < Math.max(0.15, 0.75 - (21 - d) * 0.03);
      const t = new Date(base); t.setHours(22, 40 + Math.round(rnd(-20, 40)));
      S.entries.push({ id: uid(), sub, ts: t.toISOString(), name: heavy ? '2 pills' : '1 pill', mg: heavy ? 50 : 25, icon: heavy ? 'two' : 'tablet' });
    }
  }
  st.baseline = null; st.start = null;
  lastChartSub = null;
  save(); render();
  toast('Sample data loaded');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.mode) { if (t.dataset.mode !== mode) { mode = t.dataset.mode; editing = false; closeForm(); render(); } return; }
  if (e.target.closest('[data-deldrink]')) { deleteDrink(e.target.closest('[data-deldrink]').dataset.deldrink); return; }
  if (t.dataset.drink) {
    const d = (S.drinks[mode] || []).find(x => x.id === t.dataset.drink); if (!d) return;
    if (editing) { openForm(d); return; }
    const r = t.getBoundingClientRect(); spawnFloat(r.left + r.width/2, r.top, '+' + withUnit(mode, d.mg));
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch(err) {} }
    addEntry(d.name, d.mg, null, d.icon); return;
  }
  if (t.dataset.new) { if (formState && formState.id === null && $('#customForm').classList.contains('open')) closeForm(); else openForm(null); return; }
  if (t.dataset.edit) { editing = !editing; closeForm(); renderChips(); return; }
  if (t.dataset.pick) { $('#customForm').dataset.icon = t.dataset.pick; document.querySelectorAll('.icopick').forEach(b => b.classList.toggle('on', b === t)); return; }
  if (t.id === 'fCancel') { closeForm(); return; }
  if (t.id === 'fDelete') { const id = formState && formState.id; closeForm(); if (id) deleteDrink(id); return; }
  if (t.id === 'fOnce') {
    const v = readForm(); if (!v) return;
    const tv = $('#fTime') ? $('#fTime').value : ''; const ts = tv ? new Date(tv).toISOString() : null;
    closeForm(); addEntry(v.name, v.mg, ts, v.icon); return;
  }
  if (t.id === 'fSave') {
    const v = readForm(); if (!v) return;
    const list = S.drinks[mode] = S.drinks[mode] || [];
    if (formState && formState.id) {
      const d = list.find(x => x.id === formState.id);
      if (d) { d.name = v.name; d.mg = v.mg; d.icon = v.icon; }
      closeForm(); save(); render(); toast(`Saved ${v.name}`);
    } else {
      const d = { id: uid(), name: v.name, mg: v.mg, icon: v.icon };
      list.push(d); closeForm(); save(); addEntry(d.name, d.mg, null, d.icon);
    }
    return;
  }
  if (t.dataset.range) { range = t.dataset.range === 'Infinity' ? Infinity : Number(t.dataset.range); lastChartSub = null; renderHero(); return; }
  if (t.dataset.del) { removeEntry(t.dataset.del); return; }
  if (t.id === 'undo') { if (undoFn) undoFn(); $('#toast').classList.remove('show'); undoFn = null; return; }
  if (t.id === 'resetDrinks') {
    const kept = (S.drinks[mode] || []).filter(d => !SUBS[mode].drinks.some(x => x.name === d.name));
    S.drinks[mode] = seedDrinks(mode).concat(kept); save(); render(); $('#settings').open = true; toast('Defaults restored'); return;
  }
  if (t.dataset.action === 'sample') { const wasOpen = $('#settings').open; loadSample(); $('#settings').open = wasOpen; window.scrollTo({ top:0, behavior: reduced ? 'auto' : 'smooth' }); return; }
  if (t.id === 'clear') {
    if (!confirm(`Remove every ${SUBS[mode].label} entry? Undo is not available for this.`)) return;
    S.entries.filter(x => x.sub === mode).forEach(e => S.deletedIds.push(e.id));
    S.entries = S.entries.filter(x => x.sub !== mode); lastChartSub = null; save(); render(); $('#settings').open = true; return;
  }
  if (t.id === 'copyExport') {
    const box = $('#exportBox'); box.select();
    try { navigator.clipboard.writeText(box.value); toast('Copied'); } catch(err) { document.execCommand('copy'); toast('Copied'); }
    return;
  }
  if (t.id === 'doImport') {
    try { const s = JSON.parse($('#importBox').value); S = migrate(s); lastChartSub = null; save(); render(); $('#data').open = true; toast('Imported'); }
    catch(err) { toast('That did not look like a backup'); }
    return;
  }
});

document.addEventListener('change', e => {
  const key = e.target.dataset.set; if (!key) return;
  const st = S.settings[mode]; const v = e.target.value;
  if (key === 'start') st.start = v || null;
  else if (key === 'baseline') st.baseline = v === '' ? null : (mode === 'dph' ? toMg(mode, Math.max(0, parseFloat(v))) : Math.max(0, parseFloat(v)));
  else if (key === 'window') st.window = Math.min(14, Math.max(3, parseInt(v, 10) || 7));
  else if (key === 'cutoff') st.cutoff = Math.min(12, Math.max(0, parseInt(v, 10) || 0));
  else if (key === 'taper') st.taper = Math.min(50, Math.max(0, parseFloat(v) || 0));
  else if (key === 'goal') st.goal = mode === 'dph' ? toMg(mode, Math.max(0, parseFloat(v) || 0)) : Math.max(0, parseFloat(v) || 0);
  else if (key === 'tabMg') st.tabMg = Math.max(1, parseFloat(v) || 25);
  save(); render(); $('#settings').open = true;
});

document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'fAmt' || e.target.id === 'fName')) { const b = $('#fSave'); if (b) b.click(); } if (e.key === 'Escape' && formState) closeForm(); });
document.addEventListener('pointermove', e => { if (e.target.closest && e.target.closest('#hero svg.chart')) showTip(e.clientX); else hideTip(); });
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#hero svg.chart')) showTip(e.clientX); });
document.addEventListener('pointerleave', hideTip);
window.addEventListener('resize', movePill);

// ---------- start ----------
load();
const h = new Date().getHours();
mode = (h >= 20 || h < 4) ? 'dph' : 'caf';
render();
requestAnimationFrame(movePill);

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(function(){});
}
})();
</script>
</body>
